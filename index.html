<html lang="th">
<head>

<style>:root{
  --bg:#f6f4ef; --surface:#ffffff; --ink:#1d2330; --muted:#5f6675; --line:#e3dfd6;
  --brand:#1f5fbf; --brand-ink:#ffffff; --brand-soft:#e6eefb;
  --ok:#1f7a4d; --ok-soft:#e5f4ec; --bad:#b4232c; --bad-soft:#fbe9ea; --warn:#9a6400; --warn-soft:#fdf3dc;
  --focus:#2554c7; --radius:14px; --shadow:0 1px 2px rgba(20,20,30,.06),0 4px 14px rgba(20,20,30,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c; --surface:#1e2128; --ink:#eceef2; --muted:#a3a9b6; --line:#2e323b;
    --brand:#6ea0f0; --brand-ink:#14171d; --brand-soft:#1f2a3d;
    --ok:#4cc38a; --ok-soft:#1a3326; --bad:#ef6b72; --bad-soft:#3a2023; --warn:#e3b04b; --warn-soft:#3a3020; --focus:#7aa2ff;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c; --surface:#1e2128; --ink:#eceef2; --muted:#a3a9b6; --line:#2e323b;
  --brand:#6ea0f0; --brand-ink:#14171d; --brand-soft:#1f2a3d;
  --ok:#4cc38a; --ok-soft:#1a3326; --bad:#ef6b72; --bad-soft:#3a2023; --warn:#e3b04b; --warn-soft:#3a3020; --focus:#7aa2ff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.6;overflow-wrap:anywhere}
a{color:var(--brand)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.logo{font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;min-width:0}
.logo .dot{width:28px;height:28px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:15px;flex:none}
.logo span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
h1{font-size:24px;line-height:1.3;margin:20px 0 6px}
h2{font-size:19px;margin:22px 0 8px}
h3{font-size:17px;margin:14px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--brand)}
.mode b{font-size:17px}
.mode .muted{font-size:14px}
.mode .tag{font-size:12px;color:var(--brand);font-weight:600;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 8px;font-size:14px;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:600}
.pill.gray{background:var(--line);color:var(--ink)}
.stem{font-size:19px;font-weight:600;line-height:1.55;margin:6px 0 14px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;line-height:1.5}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px}
.choice[aria-checked="true"]{border-color:var(--focus)}
.choice[aria-checked="true"] .k{background:var(--focus);border-color:var(--focus);color:#fff}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.choice:disabled{cursor:default}
.fb{border-radius:12px;padding:14px;margin-top:14px;border:1px solid var(--line);background:var(--surface)}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb .verdict{font-weight:700;font-size:18px}
.why{margin:8px 0 0;padding-left:0;list-style:none}
.why li{margin:6px 0;padding-left:28px;position:relative}
.why li .k{position:absolute;left:0;top:1px;font-weight:700}
.src{margin-top:10px;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
.navbar .wrap{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));flex-wrap:nowrap}
.navbar .btn{flex:1;padding-left:8px;padding-right:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.palette button{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.palette button.done{background:var(--brand-soft);border-color:var(--brand)}
.palette button.cur{outline:2px solid var(--focus)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .term{font-size:21px;font-weight:700}
.flash .def{font-size:17px}
.banner{border-radius:12px;padding:12px 14px;background:var(--warn-soft);border:1px solid var(--warn);margin:12px 0}
.ok-text{color:var(--ok)} .bad-text{color:var(--bad)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);margin:8px 0}
summary{cursor:pointer;font-weight:600}
ul.tight{margin:6px 0;padding-left:20px} ul.tight li{margin:4px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:18px;max-width:420px;width:100%;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--muted)}
.footer{margin-top:32px;font-size:13px;color:var(--muted)}
.input{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:6px 10px;width:110px}
</style>
</head>

<script>window.DATA={"meta":{"course":"CDM3210 / MCS3380 สื่อสังคมออนไลน์ (Online Social Media)","sourceShort":"สไลด์บรรยายสรุป","pgLabel":"","storeKey":"mint_cdm3210_v1","examFormat":"ตามสไลด์ที่ 2: ข้อสอบปรนัย 100 ข้อ เวลา 2 ชั่วโมง","tips":["ข้อสอบจริง 100 ข้อ / 2 ชั่วโมง → เฉลี่ย ~1.2 นาทีต่อข้อ ข้อไหนคิดเกิน 2 นาทีให้ข้ามไปก่อน","อาจารย์ย้ำ (สไลด์ 32): ข้อสอบออกจากทุกบท ไม่เน้นบทใดเป็นพิเศษ เน้น 'ความหมายของคำและประโยค' — อ่านตัวเลือกให้ละเอียด ไม่ต้องรีบ","ระวังคำว่า 'ไม่ใช่', 'ถูกทุกข้อ', 'ผิดทุกข้อ' — สไลด์สรุปมีโจทย์แบบนี้","ก่อนส่งข้อสอบ ตรวจการฝนรหัสประจำตัวให้ถูกต้อง","นอนให้พอ — ความจำที่ฝึกไว้จะถูกจัดเก็บระหว่างหลับ"],"about":["สร้างจากคลิปบรรยายสรุป (class 10) ของ รศ.ดร.พัน จัดรไชยยันต์ — ดึงภาพสไลด์ทั้ง 33 หน้าจากวิดีโอแล้วเขียนข้อสอบใหม่จากเนื้อหาบนสไลด์ ทุกข้อระบุเลขสไลด์และข้อความอ้างอิง","ยังไม่ได้ใช้คำบรรยายเสียงของอาจารย์ (ระบบถอดเสียงใช้ไม่ได้ในสภาพแวดล้อมที่สร้างเว็บ) โจทย์ในสไลด์ที่อาจารย์เฉลยด้วยวาจาเท่านั้นจึงไม่ถูกนำมาเป็นข้อสอบ หรือระบุหมายเหตุไว้","ข้อที่มีป้าย 'เสริม นอกสไลด์' เป็นแนวคิดทั่วไปที่เกี่ยวข้อง (เช่น ชื่อนักวิชาการเจ้าของทฤษฎี) ใช้ทบทวนเสริม ควรตรวจกับตำราอีกครั้ง — กรองออกได้ในโหมดฝึกข้อสอบ","สไลด์ 32 ระบุว่าเนื้อหาในสไลด์เป็นเพียงแนวทาง ไม่ใช่ทุกอย่างที่อยู่ในข้อสอบ ควรอ่านตำราประกอบ — เว็บนี้ไม่ได้ทำนายข้อสอบจริง","ไม่มีบัญชี ไม่ต้องล็อกอิน ความคืบหน้าเก็บใน localStorage ของเบราว์เซอร์เครื่องนี้เท่านั้น"]},"pairs":[{"t":"ยุคสื่อสารมวลชน vs ยุคสื่อสังคมออนไลน์","a":"สื่อมวลชน: โมเดล SMCR, สื่อทำอะไรกับผู้คน (what media do to people), มีบรรณาธิการคัดกรอง, สื่ออันทรงพลัง","b":"ออนไลน์: คนส่วนใหญ่พูดกับคนส่วนใหญ่, สองทาง, socially constructed, ไม่มีบรรณาธิการ, กระจายอำนาจ, ผู้คนทำอะไรกับสื่อ","tip":"ยุคออนไลน์ = อำนาจอยู่ที่ผู้ใช้","ref":"สไลด์ 6, 9"},{"t":"Networked individualism vs กลุ่มสังคมแบบเดิม","a":"แบบเดิม: กลุ่มสังคมรวมตัวเหนียวแน่น มีระบบชนชั้น","b":"ปัจเจกนิยมเครือข่าย: เชื่อมต่อระดับปัจเจกชน เข้าถึงสาร/เครือข่ายได้ทุกที่ทุกเวลา อิสระ ไม่ถูกควบคุม","tip":"'ปัจเจก' แต่ยัง 'เครือข่าย' — ไม่ใช่การแยกตัว","ref":"สไลด์ 10"},{"t":"Transmedia vs Citizen journalism","a":"Transmedia (ตามสไลด์สรุป): การส่งต่อข้อมูลข่าวสารระหว่างผู้ใช้สื่อสังคมออนไลน์ — อยู่ใต้หัวข้อการเปลี่ยนทิศทางการไหลเวียนของข่าวสาร","b":"Citizen journalism: ผู้ผลิตเนื้อหาคือนักข่าวพลเมือง","tip":"สไลด์ 16 ถาม transmedia มีตัวเลือก 'ถูกทุกข้อ' — อาจารย์เฉลยด้วยวาจา ให้ตรวจกับคำบรรยาย","ref":"สไลด์ 12, 15, 16"},{"t":"Social shaming vs Social sanction vs Vigilantism","a":"Shaming: ทำให้อับอาย มักเกิดหลังการละเมิดบรรทัดฐาน เป็น social control ไม่เป็นทางการ ตีตรา (stigma) | Sanction: การลงโทษโดยสังคม กดดันพฤติกรรมเบี่ยงเบน","b":"Vigilantism (ล่าแม่มด): กลุ่มคนคิดเหมือนกันรวมตัวแสดงออกแบบเดียวกันเพื่อลงโทษให้อับอาย","tip":"Vigilantism เน้น 'การรวมกลุ่ม'","ref":"สไลด์ 27–28"},{"t":"คนเหงา vs คนไม่เหงา","a":"คนเหงา → โลกออนไลน์: ใช้เวลาออนไลน์มาก, หาการสนับสนุน/คนคิดคล้ายกัน, พอใจออนไลน์มากกว่าเผชิญหน้า, lurk","b":"คนไม่เหงา → โลกในชีวิตจริง (เผชิญหน้า)","tip":"ใครถูกดึงดูดเข้าออนไลน์มากกว่า = คนเหงา","ref":"สไลด์ 24–25"},{"t":"ปัญหาการรับรู้ข่าวสาร 3 อย่าง","a":"fake news / infodemic · post-truth","b":"echo chamber","tip":"ทั้งหมดอยู่ใน 'ปัญหาจากการรับรู้ข่าวสาร' — ส่วน shaming/ระราน อยู่อีกกลุ่ม","ref":"สไลด์ 26"},{"t":"Media literacy vs Digital citizenship","a":"Media literacy: องค์ประกอบสำคัญ + วิธีปฏิบัติเพื่อรู้เท่าทัน","b":"Digital citizenship: 3 มิติ (ความรู้สื่อ/สารสนเทศ, จริยธรรม, มีส่วนร่วมการเมือง/สังคม) + ทักษะ 8 ข้อ","tip":"ตัวเลข: 3 มิติ / 8 ทักษะ / 12 ประเภทสื่อ (บท 2)","ref":"สไลด์ 30"},{"t":"Paid vs Earned vs Owned","a":"Paid = สื่อซื้อ | Earned = สื่อที่ได้รับ","b":"Owned = สื่อที่เป็นเจ้าของ","tip":"ซื้อ / ได้รับ / เป็นเจ้าของ","ref":"สไลด์ 31"},{"t":"ตัวเลขที่ควรจำ","a":"12 ประเภทสื่อ · 2 แบบคุณลักษณะ (ทั่วไป/เฉพาะ) · 88% ปฏิสัมพันธ์ทางสังคม (สูงสุด)","b":"3 ความสำคัญ · 3 กลุ่มปัญหา · 3 มิติพลเมืองดิจิทัล · 8 ทักษะ · 9 บท · 100 ข้อ 2 ชม.","tip":"อ่านโจทย์ตัวเลขให้ดี","ref":"สไลด์ 2, 11, 12, 26, 30"}],"chapters":[{"ch":1,"title":"ความหมายและพัฒนาการของสื่อสังคมออนไลน์","short":"UGC, SMCR → ยุคออนไลน์, Networked individualism","summary":["ลักษณะของสื่อสังคมออนไลน์ (แผนภาพ): การสนทนาออนไลน์ · สื่อสารไปยังเครือข่ายสังคมของตน · รูปแบบหลากหลาย เช่น รูปภาพ ข้อความ กิจกรรม · มีปฏิสัมพันธ์กับผู้รับสารหลายระดับทั้งกลุ่มใหญ่และย่อย · ผู้ใช้ผลิตเนื้อหาขึ้นเอง (UGC) · เนื้อหาเกี่ยวกับตัวตน/การแบ่งปันประสบการณ์ส่วนตัว (สไลด์ 5)","ยุคการสื่อสารมวลชนใช้โมเดล SMCR (Sender–Message–Channel–Receiver) (สไลด์ 6)","ยุคสื่อสังคมออนไลน์: \"คนส่วนใหญ่พูดกับคนส่วนใหญ่\" · การสื่อสารสองทาง · ถูกสร้างขึ้นโดยกระบวนการทางสังคม (socially constructed) · ไม่มีการคัดกรองเนื้อหาจาก \"บรรณาธิการ\" (editor) · กระจายอำนาจ (decentralized) เพิ่มอำนาจให้ผู้ใช้ — ถามว่า \"ผู้คนทำอะไรกับสื่อ\" (what people do with the media) แทน \"สื่อทำอะไรกับผู้คน\" (สไลด์ 6)","ยุคออนไลน์ส่งผลให้เกิด \"ลัทธิปัจเจกนิยมเครือข่าย\" (networked individualism) = เปลี่ยนจากกลุ่มสังคมที่เหนียวแน่นและมีชนชั้น สู่การเชื่อมต่อระดับ \"ปัจเจกชน\" เข้าถึงสารและเครือข่ายได้ทุกที่ทุกเวลาอย่างอิสระ (สไลด์ 6, 10)","สื่อสังคมออนไลน์ \"ถูกสร้างขึ้นโดยกระบวนการสังคม\" = ถูก เพราะการใช้งานของผู้ใช้เปลี่ยนเสมอ แพลตฟอร์มที่เคยนิยมอาจเสื่อมความนิยมอย่างรวดเร็ว (สไลด์ 7–8)"],"cards":[["UGC","Users Generated Content — ผู้ใช้ผลิตเนื้อหาขึ้นเอง (สไลด์ 5)"],["SMCR","Sender–Message–Channel–Receiver — โมเดลการสื่อสารยุคสื่อสารมวลชน (สไลด์ 6)"],["What people do with the media","คำถามของยุคสื่อสังคมออนไลน์ (ตรงข้ามกับ what media do to people) (สไลด์ 6)"],["Socially constructed","สื่อถูกสร้าง/เปลี่ยนโดยพฤติกรรมผู้ใช้ — แพลตฟอร์มดังแล้วดับได้เร็ว (สไลด์ 7–8)"],["Networked individualism","ลัทธิปัจเจกนิยมเครือข่าย — เชื่อมต่อระดับปัจเจกชน อิสระ ไม่ผูกกับกลุ่มใหญ่ (สไลด์ 10)"]]},{"ch":2,"title":"ประเภท คุณลักษณะ และการใช้ประโยชน์สื่อสังคมออนไลน์","short":"12 ประเภท, U&G, active audience","summary":["ประเภทของสื่อสังคมออนไลน์ 12 ประเภท: (1) เครือข่ายสังคม (2) บล็อก (3) ไมโครบล็อก (4) วิดีโอออนไลน์ (5) กระดานข่าว (6) การแบ่งปันรูปภาพ (7) การส่งข้อความ (8) เกม (9) โลกเสมือนจริง (10) Podcasting (11) วิกิ (12) หาคู่รัก (สไลด์ 11)","คุณลักษณะของสื่อสังคมออนไลน์แบ่งเป็น (1) \"คุณลักษณะโดยทั่วไป\" และ (2) \"คุณลักษณะเฉพาะ\" (สไลด์ 11)","การใช้ประโยชน์อธิบายด้วย ทฤษฎีการใช้ประโยชน์และความพึงพอใจ (Uses and Gratifications Theory หรือ U&G) และบทบาทที่ \"ตื่นตัว\" ของผู้รับสาร (active audience) (สไลด์ 11)","แผนภูมิการใช้ประโยชน์: ปฏิสัมพันธ์ทางสังคม 88% > ค้นหาข้อมูล 80% > ฆ่าเวลา 76% > ความบันเทิง 64% > ผ่อนคลายความเครียด 60% > ใช้ประโยชน์ด้านการสื่อสาร 56% = แสดงความคิดเห็น 56% > ความสะดวก 52% > แบ่งปันข้อมูล 40% > ต่ำสุด 20% (สไลด์ 11)"],"cards":[["12 ประเภท","เครือข่ายสังคม, บล็อก, ไมโครบล็อก, วิดีโอออนไลน์, กระดานข่าว, แบ่งปันรูปภาพ, ส่งข้อความ, เกม, โลกเสมือนจริง, Podcasting, วิกิ, หาคู่รัก (สไลด์ 11)"],["U&G","Uses and Gratifications Theory — ผู้รับสารเลือกใช้สื่อเพื่อตอบสนองความต้องการ (สไลด์ 11)"],["Active audience","บทบาทที่ \"ตื่นตัว\" ของผู้รับสาร (สไลด์ 11)"],["อันดับ 1 การใช้ประโยชน์","การปฏิสัมพันธ์ทางสังคม 88% (สไลด์ 11)"]]},{"ch":3,"title":"ความสำคัญของสื่อสังคมออนไลน์","short":"Transmedia, Citizen journalism, Social capital, การเมือง","summary":["ความสำคัญ 3 ด้าน: (1) ต่อการรับรู้และส่งผ่านข้อมูลข่าวสาร (2) ต่อการขยายเครือข่ายสังคม (3) ต่อการสื่อสารการเมือง (สไลด์ 12)","ด้านข้อมูลข่าวสาร: รับรู้แบบไม่เรียงลำดับ · แบบไม่รวมจุดศูนย์กลาง/กระจายอำนาจ · การเปลี่ยนทิศทางการไหลเวียนของข่าวสาร — แนวคิด Transmedia (การส่งต่อข้อมูลระหว่างผู้ใช้สื่อสังคมออนไลน์) · แนวคิดวารสารศาสตร์พลเมือง (citizen journalism) (สไลด์ 12)","วารสารศาสตร์พลเมือง: ผู้ผลิตเนื้อหาคือ \"นักข่าวพลเมือง\" (citizen journalists) (สไลด์ 15)","ด้านเครือข่ายสังคม: กระบวนการขยายเครือข่าย · รูปแบบความสัมพันธ์ (ขยายกับคนรู้จัก / สร้างกับคนแปลกหน้า) · ทุนทางสังคม (social capital) — พฤติกรรมบริหารความสัมพันธ์บนเฟซบุ๊กทำให้เกิดการเชื่อมโยง (bridging) ทุนทางสังคม (สไลด์ 13)","เฟซบุ๊กสร้าง \"ทุนทางสังคม\" ที่ให้ผลประโยชน์ทางเศรษฐกิจได้ = ถูก — มีการจัดแสดงอย่างเป็นสาธารณะ (public display) ความเป็นเพื่อน เชื่อมต่อไม่เป็นทางการ เกิด \"การบริหารความสัมพันธ์\" (relationship maintenance) (สไลด์ 17–18)","ด้านการเมือง: จุดเด่น = เครือข่ายแนวนอน (horizontal), multimedia, hypertext, ความเป็นเอกเทศของผู้กระทำการทางสังคม (autonomy of social actors); การมีส่วนร่วม = social movement (#MeToo, #BlackLivesMatter, Arab Spring), การแบ่งขั้วทางการเมือง (political polarization), ปฏิบัติการข่าวสาร (IO) (สไลด์ 14)"],"cards":[["Transmedia (ตามสไลด์)","การส่งต่อข้อมูลข่าวสารระหว่างผู้ใช้สื่อสังคมออนไลน์ — อยู่ใต้หัวข้อ \"การเปลี่ยนทิศทางการไหลเวียนของข้อมูลข่าวสาร\" (สไลด์ 12)"],["Citizen journalism","วารสารศาสตร์พลเมือง — ผู้ผลิตเนื้อหาคือนักข่าวพลเมือง (สไลด์ 12, 15)"],["Social capital (bridging)","การบริหารความสัมพันธ์บนเฟซบุ๊กทำให้เกิดการเชื่อมโยงทุนทางสังคม (สไลด์ 13)"],["Relationship maintenance","การบริหารความสัมพันธ์ระหว่างผู้ใช้ → ประโยชน์ทางเศรษฐกิจได้ (สไลด์ 18)"],["จุดเด่นด้านการเมือง","horizontal, multimedia, hypertext, autonomy of social actors (สไลด์ 14)"],["IO","การปฏิบัติการข่าวสาร (information operation) (สไลด์ 14)"]]},{"ch":4,"title":"สื่อสังคมออนไลน์กับการสื่อสารผ่านโทรศัพท์มือถือ","short":"มือถือ, การส่งข้อความ","summary":["หัวข้อ: การสื่อสารผ่านโทรศัพท์มือถือ · ความสำคัญของโทรศัพท์มือถือในชีวิตประจำวัน · วัฒนธรรมการใช้สื่อสังคมออนไลน์ผ่านโทรศัพท์มือถือ (สไลด์ 19)","คำถาม-คำตอบ: ระหว่างการส่งข้อความผ่านมือถือกับการสื่อสารในชีวิตจริง \"การส่งข้อความ\" ทำให้แสดงความรู้สึกลึกซึ้งได้มากกว่า เพราะช่วยให้ \"เขียนสิ่งที่อยู่ในใจ\" ออกมาได้มากกว่าการสนทนา — การแสดงความรู้สึกผ่านคำพูดยากกว่าการเขียน (สไลด์ 20)"],"cards":[["หัวข้อบทที่ 4","การสื่อสารผ่านมือถือ / ความสำคัญในชีวิตประจำวัน / วัฒนธรรมการใช้ผ่านมือถือ (สไลด์ 19)"],["ส่งข้อความ vs คุยต่อหน้า","ส่งข้อความแสดงความรู้สึกลึกซึ้งได้มากกว่า เพราะ \"เขียนสิ่งที่อยู่ในใจ\" ได้ง่ายกว่าพูด (สไลด์ 20)"]]},{"ch":5,"title":"สื่อสังคมออนไลน์กับอัตลักษณ์ออนไลน์","short":"อัตลักษณ์, อัตลักษณ์ออนไลน์","summary":["หัวข้อ: ความหมายของอัตลักษณ์ · แนวคิดอัตลักษณ์ออนไลน์ · วิธีการสื่อสารอัตลักษณ์ออนไลน์ผ่านสื่อสังคมออนไลน์ (สไลด์ 21)","สไลด์ 22 ตั้งคำถาม \"ข้อใดไม่ใช่อัตลักษณ์\" โดยมีตัวเลือก เชื้อชาติ / สัญชาติ / ภาษาที่ถนัด / การเป็นนักศึกษา ม.รามคำแหง / การได้เหรียญทองโอลิมปิก — สไลด์ไม่ได้แสดงเฉลย (อาจารย์เฉลยด้วยวาจา) จึงไม่นำมาออกเป็นข้อสอบในเว็บนี้ แต่ใช้เป็นตัวอย่างว่าอัตลักษณ์ครอบคลุมทั้งสิ่งที่ติดตัวมาและสิ่งที่ได้มาภายหลัง"],"cards":[["หัวข้อบทที่ 5","ความหมายของอัตลักษณ์ / แนวคิดอัตลักษณ์ออนไลน์ / วิธีการสื่อสารอัตลักษณ์ออนไลน์ (สไลด์ 21)"],["ตัวอย่างในคำถามสไลด์ 22","เชื้อชาติ, สัญชาติ, ภาษาที่ถนัด, สถานะนักศึกษา, ความสำเร็จ (เหรียญทอง) — เฉลยด้วยวาจา"]]},{"ch":6,"title":"แนวคิดทางจิตวิทยาเกี่ยวกับการใช้สื่อสังคมออนไลน์","short":"ความเหงา, การยอมรับ, นำเสนอตัวตน, lurk","summary":["หัวข้อ: ความเหงากับการใช้สื่อสังคมออนไลน์ · ความต้องการการยอมรับ · ความต้องการนำเสนอตัวตน (สไลด์ 23)","\"ใครมักถูกดึงดูดให้เข้าหาสื่อออนไลน์มากกว่ากัน\" → คนเหงา (สไลด์ 24–25)","คนเหงา: ใช้เวลาในโลกออนไลน์มากกว่า · ใช้อินเทอร์เน็ตเพื่อการสนับสนุน ส่งเสริมด้านอารมณ์ พบคนใหม่ ๆ และมีปฏิสัมพันธ์กับคนที่คิดเห็นคล้ายกัน · พอใจกับการสื่อสารออนไลน์มากกว่าการสื่อสารแบบเผชิญหน้า · พึงพอใจการไม่เป็นตัวเป็นตน และเข้าเยี่ยมชมเนื้อหาโดยไม่เปิดเผยตัวตน (lurk) (สไลด์ 25)","แผนภาพ: คนเหงา → โลกออนไลน์ / คนไม่เหงา → โลกในชีวิตจริง (การสื่อสารแบบเผชิญหน้า) (สไลด์ 25)"],"cards":[["หัวข้อบทที่ 6","ความเหงา / ความต้องการการยอมรับ / ความต้องการนำเสนอตัวตน (สไลด์ 23)"],["ใครเข้าหาออนไลน์มากกว่า","คนเหงา (สไลด์ 24–25)"],["Lurk","เข้าเยี่ยมชมเนื้อหาและบทสนทนาโดยไม่เปิดเผยตัวตน (สไลด์ 25)"]]},{"ch":7,"title":"ปัญหาจากการใช้สื่อสังคมออนไลน์","short":"Fake news, Post-truth, Echo chamber, Shaming, Vigilantism","summary":["ปัญหา 3 กลุ่ม: (1) ปัญหาจากการรับรู้ข่าวสาร — ข่าวลือ (fake news)/การระบาดของข้อมูลที่บิดเบือน (infodemic), แนวคิดโลกยุคหลังความจริง (post-truth), ห้องเสียงสะท้อน (echo chamber) (2) ปัญหาการละเมิดความเป็นส่วนตัวออนไลน์ (3) ปัญหาความขัดแย้ง การระรานทางไซเบอร์ และการทำให้อับอายบนสื่อสังคมออนไลน์ (สไลด์ 26)","ก่อนถูกทำให้อับอายทางออนไลน์ (social shaming) บุคคลมักกระทำ \"การละเมิดบรรทัดฐานทางสังคม\" ก่อน — shaming เป็นวิธีการควบคุมทางสังคม (social control) แบบไม่เป็นทางการ ลงโทษด้วยการทำให้อับอายและถูกตีตรา (stigma) แม้ยังไม่ถูกกระบวนการยุติธรรมตัดสิน (สไลด์ 27)","Social Sanction (การลงโทษโดยสังคม) = การกระทำต่อต้านบุคคล ครอบครัว เพื่อกดดันและแสดงปฏิกิริยาต่อต้านพฤติกรรมที่เบี่ยงเบนจากความถูกต้อง/มาตรฐานสังคม (สไลด์ 28)","\"ขบวนการล่าแม่มด\" (Vigilantism) = การรวมกลุ่มคนที่คิดเห็นคล้ายกันและไม่พึงพอใจต่อเหตุการณ์ จนรวมตัวแสดงออกในรูปแบบคล้ายกัน เพื่อลงโทษบุคคลให้เป็นที่อับอาย (สไลด์ 28)"],"cards":[["Infodemic","การระบาดของข้อมูลที่บิดเบือน (สไลด์ 26)"],["Post-truth","แนวคิดโลกยุคหลังความจริงกับการรับรู้ข่าวสาร (สไลด์ 26)"],["Echo chamber","ปัญหาห้องเสียงสะท้อน (สไลด์ 26)"],["Social shaming","มักเกิดหลัง \"การละเมิดบรรทัดฐานทางสังคม\" — social control แบบไม่เป็นทางการ (สไลด์ 27)"],["Social sanction","การลงโทษโดยสังคม — กดดันพฤติกรรมที่เบี่ยงเบน (สไลด์ 28)"],["Vigilantism","ขบวนการล่าแม่มด — กลุ่มคนคิดเหมือนกันรวมตัวลงโทษให้อับอาย (สไลด์ 28)"]]},{"ch":8,"title":"แนวทางการใช้และการรู้เท่าทันสื่อสังคมออนไลน์","short":"Media literacy, Digital citizenship","summary":["หัวข้อ: แนวทางการใช้สื่อสังคมออนไลน์ · แนวคิดการรู้เท่าทันสื่อสังคมออนไลน์ · แนวคิดพลเมืองดิจิทัล (สไลด์ 29)","แนวทางการใช้: ของบุคคลทั่วไป / ของสื่อมวลชน (แนวปฏิบัติเรื่องการใช้สื่อสังคมออนไลน์ของสื่อมวลชน และแนวปฏิบัติการนำเสนอการถ่ายทอดสดเหตุการณ์ข่าวทางสื่อสังคมออนไลน์) (สไลด์ 30)","การรู้เท่าทันสื่อสังคมออนไลน์ (Media literacy): องค์ประกอบสำคัญ และวิธีการปฏิบัติ (สไลด์ 30)","พลเมืองดิจิทัล (Digital Citizenship) — ไฮไลต์ในสไลด์: องค์ประกอบ 3 มิติ = ความรู้เกี่ยวกับสื่อและสารสนเทศ / จริยธรรม / การมีส่วนร่วมทางการเมืองและสังคม และทักษะที่สำคัญ 8 ข้อ (สไลด์ 30)"],"cards":[["หัวข้อบทที่ 8","แนวทางการใช้ / Media literacy / Digital citizenship (สไลด์ 29)"],["พลเมืองดิจิทัล 3 มิติ","ความรู้เกี่ยวกับสื่อและสารสนเทศ · จริยธรรม · การมีส่วนร่วมทางการเมืองและสังคม (สไลด์ 30)"],["ทักษะพลเมืองดิจิทัล","8 ข้อ (สไลด์ 30 — รายละเอียดอยู่ในตำรา)"],["แนวปฏิบัติของสื่อมวลชน","การใช้สื่อสังคมออนไลน์ของสื่อมวลชน + การถ่ายทอดสดเหตุการณ์ข่าวทางสื่อสังคมออนไลน์ (สไลด์ 30)"]]},{"ch":9,"title":"การนำสื่อสังคมออนไลน์ไปใช้ในองค์กร","short":"การตลาด, โฆษณา, PR, Paid/Earned/Owned","summary":["หัวข้อ: สื่อสังคมออนไลน์กับการสื่อสารการตลาด · กับการโฆษณา · กับการประชาสัมพันธ์ · แนวโน้มการนำไปใช้ในองค์กร (ภายในองค์กร / กับผู้มีส่วนได้ส่วนเสีย) (สไลด์ 31)","แผนภาพ 3 วง: สื่อซื้อ (Paid Media) · สื่อที่ได้รับ (Earned Media) · สื่อที่เป็นเจ้าของ (Owned Media) (สไลด์ 31)"],"cards":[["Paid Media","สื่อซื้อ (สไลด์ 31)"],["Earned Media","สื่อที่ได้รับ (สไลด์ 31)"],["Owned Media","สื่อที่เป็นเจ้าของ (สไลด์ 31)"],["แนวโน้มในองค์กร","ใช้ภายในองค์กร / ใช้กับผู้มีส่วนได้ส่วนเสีย (สไลด์ 31)"]]}],"questions":[{"id":"m1-01","lv":1,"lo":"ระบุลักษณะของสื่อสังคมออนไลน์","q":"ตามแผนภาพในสไลด์ \"Users Generated Content (UGC)\" หมายถึงลักษณะใดของสื่อสังคมออนไลน์","c":["ผู้ใช้เป็นผู้ผลิตเนื้อหาขึ้นเอง","บรรณาธิการคัดเลือกเนื้อหาก่อนเผยแพร่","องค์กรสื่อเป็นเจ้าของเนื้อหาทั้งหมด","เนื้อหาต้องผ่านการรับรองจากรัฐก่อน"],"ex":"UGC คือ \"ผู้ใช้ผลิตเนื้อหาขึ้นเอง\" เป็นหนึ่งในลักษณะของสื่อสังคมออนไลน์ในแผนภาพสไลด์ 5","w":["ยุคสื่อสังคมออนไลน์ \"ไม่มีการคัดกรองเนื้อหาจากบรรณาธิการ\"","UGC เน้นว่าผู้ใช้ทั่วไปเป็นผู้สร้าง ไม่ใช่องค์กรสื่อ","สไลด์ไม่ได้กล่าวถึงการรับรองจากรัฐ"],"pg":"สไลด์ 5","ev":"ผู้ใช้ผลิตเนื้อหาขึ้นเอง Users Generated Content (UGC)","sc":0,"x":0,"ch":1},{"id":"m1-02","lv":2,"lo":"แยกลักษณะของสื่อสังคมออนไลน์","q":"ข้อใด \"ไม่ใช่\" ลักษณะของสื่อสังคมออนไลน์ตามแผนภาพในสไลด์บทที่ 1","c":["สื่อสารทางเดียวจากผู้ส่งไปยังผู้รับจำนวนมาก","มีปฏิสัมพันธ์กับผู้รับสารหลายระดับทั้งกลุ่มใหญ่และย่อย","มีรูปแบบหลากหลาย เช่น รูปภาพ ข้อความ และกิจกรรมอื่น ๆ","เนื้อหาเกี่ยวกับตัวตนและการแบ่งปันประสบการณ์ส่วนตัว"],"ex":"สไลด์ 6 ระบุว่ายุคสื่อสังคมออนไลน์เป็น 'การสื่อสารสองทาง' และแผนภาพสไลด์ 5 เน้นปฏิสัมพันธ์ — การสื่อสารทางเดียวจึงไม่ใช่ลักษณะในแผนภาพ","w":["เป็นลักษณะในแผนภาพสไลด์ 5","เป็นลักษณะในแผนภาพสไลด์ 5","เป็นลักษณะในแผนภาพสไลด์ 5"],"pg":"สไลด์ 5–6","ev":"มีปฏิสัมพันธ์กับผู้รับสารหลายระดับทั้งในกลุ่มใหญ่และย่อย / \"การสื่อสารสองทาง\"","sc":0,"x":0,"ch":1},{"id":"m1-03","lv":1,"lo":"จำโมเดลการสื่อสารยุคสื่อสารมวลชน","q":"ยุคการสื่อสารมวลชนใช้โมเดลการสื่อสารใดตามสไลด์","c":["SMCR (Sender–Message–Channel– <script>/* Mint's Crisis Exam Coach — vanilla JS, no backend. Data in window.DATA */
(function(){
'use strict';
const D = window.DATA;
const CH = D.chapters;                       // [{ch,title,short,summary,cards}]
const Q = D.questions;                       // [{id,ch,lv,sc,lo,q,c,ex,w,pg,ev}]  c[0] is correct in source
const QBY = Object.fromEntries(Q.map(q=>[q.id,q]));
const KEYS = ['ก','ข','ค','ง'];
const LV = {1:'จำ/เข้าใจ',2:'แยกแยะแนวคิด',3:'ประยุกต์/สถานการณ์'};
const STORE_KEY = (D.meta.storeKey||'mintcc_v1');
const $app = document.getElementById('app');
const $nav = document.getElementById('navbar');

// ---------- storage (try/catch, works without storage) ----------
let S = {stats:{}, mistakes:{}, minutes:null, session:null, theme:null};
try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
if(S.theme) document.documentElement.setAttribute('data-theme', S.theme);

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function chTitle(n){ const c=CH.find(x=>x.ch===n); return c?c.title:''; }
function chStats(n){ let a=0,c=0,seen=0; Q.filter(q=>q.ch===n).forEach(q=>{const s=S.stats[q.id]; if(s){a+=s.a;c+=s.c;seen++;}}); return {a,c,seen,total:Q.filter(q=>q.ch===n).length,acc:a?c/a:null}; }
function overall(){ let a=0,c=0,seen=0; Q.forEach(q=>{const s=S.stats[q.id]; if(s){a+=s.a;c+=s.c;seen++;}}); return {a,c,seen,acc:a?c/a:null}; }
function pct(x){ return x==null?'–':Math.round(x*100)+'%'; }
function barColor(x){ return x==null?'var(--line)': x>=.8?'var(--ok)': x>=.6?'var(--warn)':'var(--bad)'; }
function weakChapters(k){
  return CH.map(c=>({ch:c.ch,s:chStats(c.ch)}))
    .sort((x,y)=>{ const ax=x.s.acc==null?-1:x.s.acc, ay=y.s.acc==null?-1:y.s.acc; return ax-ay; })
    .slice(0,k).map(x=>x.ch);
}
function record(id, ok){
  const s = S.stats[id] || {a:0,c:0};
  s.a++; if(ok) s.c++; s.last = ok?1:0; S.stats[id]=s;
  if(ok) delete S.mistakes[id]; else S.mistakes[id]=Date.now();
}
function weightedPick(pool, n){
  const items = pool.map(q=>{ const s=S.stats[q.id]; const wr = s? (1 - s.c/s.a):0.6; const w = 1 + 2.5*wr + (S.mistakes[q.id]?1.5:0); return {q, k: Math.pow(Math.random(), 1/w)}; });
  return items.sort((a,b)=>b.k-a.k).slice(0,n).map(x=>x.q);
}

// ---------- session ----------
function startSession(opts){
  const ids = opts.ids;
  const order = {}; ids.forEach(id=>order[id]=shuffle([0,1,2,3]));
  S.session = { mode:opts.mode, title:opts.title, ids, order, idx:0, ans:{}, sub:{}, skip:{}, feedback:opts.feedback,
    endAt: opts.minutes? Date.now()+opts.minutes*60000 : null, minutes: opts.minutes||null, finished:false, started:Date.now(), back: opts.back||'#/' };
  save(); location.hash = '#/quiz'; render();
}
function finishSession(){
  const s=S.session; if(!s||s.finished) return;
  if(s.feedback==='end'){ s.ids.forEach(id=>{ if(s.ans[id]!=null){ record(id, s.ans[id]===0); } }); }
  s.finished=true; s.finishedAt=Date.now(); save(); location.hash='#/results'; render();
}

// ---------- modal ----------
function confirmBox(msg, okText, onOk){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><p id="mt" style="font-weight:600">${msg}</p><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" data-x>ยกเลิก</button><button class="btn primary" data-ok>${okText}</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector('[data-x]').onclick=close;
  bg.querySelector('[data-ok]').onclick=()=>{close();onOk();};
  bg.addEventListener('click',e=>{if(e.target===bg)close();});
  bg.querySelector('[data-ok]').focus();
}

function planHtml(){
  const m=S.minutes; if(!m) return '<p class="muted small" style="margin-top:10px">เลือกเวลาที่เหลือ แล้วระบบจะจัดลำดับการฝึกให้ (ปรับได้ตลอด)</p>';
  const o=overall(); const weak=weakChapters(3); const hasData=o.seen>=8;
  const wk = weak.map(n=>'บท '+n).join(', ');
  const steps=[];
  if(!hasData) steps.push(['diag',`วัดความรู้ ${CH.length+2} ข้อ (~15 นาที) เพื่อหาบทที่อ่อน`]);
  if(m>=60) steps.push(['weak', hasData? `ฝึกเน้นบทที่อ่อน (${wk}) 20 ข้อ`:'ฝึกเน้นจุดอ่อน 20 ข้อ (ระบบเลือกจากผล Diagnostic)']);
  if(m>=120) steps.push(['learnweak', `อ่านสรุป + บัตรคำ บทที่อ่อนที่สุด (บท ${weak[0]})`]);
  if(m>=180) steps.push(['mock50','สอบจำลอง 50 ข้อ / 60 นาที']);
  if(m>=120) steps.push(['mist','ทบทวนข้อที่ผิดทั้งหมด']);
  if(m<60 && hasData) steps.push(['weak10',`ฝึก 10 ข้อจากบทที่อ่อน (${wk})`]);
  steps.push(['last','ทบทวนคู่แนวคิดที่สับสน + บัตรคำ (10 นาที) แล้วพักผ่อน']);
  return `<ol class="tight" style="margin-top:10px">${steps.map(s=>`<li><button class="btn sm ghost" data-plan="${s[0]}" style="text-align:left;justify-content:flex-start;min-height:36px;padding:4px 8px">${esc(s[1])} →</button></li>`).join('')}</ol>
  <p class="small muted">${m<=60?'เวลาน้อย: เน้นทำข้อสอบแล้วอ่านเฉลยจริงจัง ดีกว่าอ่านสไลด์ใหม่ทั้งหมด':'สลับบทไปมา (interleaving) ช่วยจำได้ดีกว่าอ่านทีละบทยาว ๆ'} · อย่าลืมนอนให้พอ การนอนช่วยให้สมองเก็บสิ่งที่ฝึกไว้</p>`;
}

function go(k){
  if(k==='diag'){ const ids=[]; CH.forEach(c=>{ const p=shuffle(Q.filter(q=>q.ch===c.ch&&!q.x)); if(p.length) ids.push(p[0].id); });
    const rest=shuffle(Q.filter(q=>q.sc && !q.x && !ids.includes(q.id))).slice(0,2).map(q=>q.id);
    return startSession({mode:'diag',title:'วัดความรู้ (Diagnostic)',ids:shuffle(ids.concat(rest)),feedback:'end'}); }
  if(k==='scen'){ return startSession({mode:'scen',title:'Scenario Challenge',ids:shuffle(Q.filter(q=>q.sc).map(q=>q.id)).slice(0,10),feedback:'instant'}); }
  if(k==='weak'||k==='weak10'){ const weak=weakChapters(3); const pool=Q.filter(q=>weak.includes(q.ch)); return startSession({mode:'practice',title:'ฝึกเน้นบทที่อ่อน',ids:weightedPick(pool,k==='weak'?20:10).map(q=>q.id),feedback:'instant'}); }
  if(k==='learnweak'){ location.hash='#/ch/'+weakChapters(1)[0]; return; }
  if(k==='mock50'){ return startMock(50,60); }
  if(k==='mist'){ location.hash='#/mistakes'; return; }
  if(k==='last'){ location.hash='#/last'; return; }
}

  startSession({mode:'mock',title:`สอบจำลอง ${ids.length} ข้อ`,ids:shuffle(ids),feedback:'end',minutes,back:'#/mock'});
}

  <div class="card"><h2 style="margin-top:0">เตือนก่อนเข้าห้องสอบ</h2><ul class="tight">
  ${(D.meta.tips||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  <h2>คู่แนวคิดที่สับสนง่าย</h2>
  ${D.pairs.map(p=>`<details><summary>${esc(p.t)}</summary><p>▸ ${esc(p.a)}</p><p>▸ ${esc(p.b)}</p><p class="small"><b>วิธีจำ:</b> ${esc(p.tip)}</p><p class="small muted">อ้างอิง: ${esc(p.ref)}</p></details>`).join('')}
  <h2>บัตรคำทุกบท (สุ่มลำดับ)</h2>
  <div class="grid">${shuffle(all).map(x=>`<div class="card flash" tabindex="0" role="button" aria-label="บัตรคำ ${esc(x.k[0])}"><div class="small muted">บทที่ ${x.ch}</div><div class="term">${esc(x.k[0])}</div><div class="def" hidden>${esc(x.k[1])}</div><div class="small muted hint">แตะเพื่อดูคำอธิบาย</div></div>`).join('')}</div>`;
  bindFlash();
  setNav('<a class="btn" href="#/">หน้าหลัก</a>');
}

function viewStats(){
  const o=overall();
  $app.innerHTML=`<h1>ผลรายบท</h1><p class="muted">ทำแล้ว ${o.seen}/${Q.length} ข้อ · ตอบทั้งหมด ${o.a} ครั้ง · ถูก ${pct(o.acc)}</p>
  <div class="card"><table><tr><th>บท</th><th style="width:38%">ความแม่น</th><th>ทำแล้ว</th></tr>
  ${CH.map(c=>{const s=chStats(c.ch); return `<tr><td><a href="#/ch/${c.ch}">บท ${c.ch}</a> <span class="small muted">${esc(c.short)}</span></td><td><div class="bar"><i style="width:${(s.acc||0)*100}%;background:${barColor(s.acc)}"></i></div><span class="small">${pct(s.acc)}</span></td><td class="small">${s.seen}/${s.total}</td></tr>`;}).join('')}
  </table><p class="small muted">เขียว ≥80% · เหลือง 60–79% · แดง &lt;60% (ใช้ประเมินตัวเอง ไม่ใช่คะแนนจริง)</p></div>
  <div class="card"><h3 style="margin-top:0">ธีม</h3><div class="chips">${[['','ตามเครื่อง'],['light','สว่าง'],['dark','มืด']].map(([v,l])=>`<button class="chip" data-t="${v}" aria-pressed="${(S.theme||'')===v}">${l}</button>`).join('')}</div>
  <h3>ล้างข้อมูล</h3><p class="small muted">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่มีการส่งออกไปที่ใด</p><button class="btn" id="rs">ล้างความคืบหน้าทั้งหมด</button></div>`;
  $app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t||null; if(S.theme) document.documentElement.setAttribute('data-theme',S.theme); else document.documentElement.removeAttribute('data-theme'); save(); viewStats();});
  document.getElementById('rs').onclick=()=>confirmBox('ล้างความคืบหน้า ข้อที่ผิด และชุดที่ทำค้างทั้งหมด?','ล้างข้อมูล',()=>{S.stats={};S.mistakes={};S.session=null;save();viewStats();});
  setNav('<a class="btn" href="#/">หน้าหลัก</a>');
}

function viewAbout(){
  $app.innerHTML=`<h1>เกี่ยวกับเว็บนี้</h1><div class="card">
  <p>เว็บติวข้อสอบปรนัยวิชา <b>${esc(D.meta.course)}</b></p><ul class="tight">${(D.meta.about||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  <div class="card"><h3 style="margin-top:0">จำนวนข้อต่อบท</h3><table>${CH.map(c=>`<tr><td>บทที่ ${c.ch} ${esc(c.title)}</td><td>${Q.filter(q=>q.ch===c.ch).length}</td></tr>`).join('')}</table></div>
  <p class="small muted">ปุ่มลัด: กด 1–4 เพื่อเลือกตัวเลือก · Enter = ส่งคำตอบ/ข้อถัดไป</p>`;
  setNav('<a class="btn" href="#/">หน้าหลัก</a>');
}

// ---------- quiz ----------
let tick=null;
function fmt(ms){ ms=Math.max(0,ms); const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0'); }
function viewQuiz(){
  const s=S.session; if(!s){ location.hash='#/'; return; }
  if(s.finished){ location.hash='#/results'; return; }
  if(s.endAt && Date.now()>=s.endAt){ finishSession(); return; }
  const id=s.ids[s.idx], q=QBY[id], ord=s.order[id];
  const chosen=s.ans[id]; const submitted = s.feedback==='instant' && s.sub[id];
  const answered = Object.keys(s.ans).filter(k=>s.ans[k]!=null).length;
  const head = `<div class="row" style="margin-top:12px"><span class="small muted" style="flex:1">${esc(s.title)}</span>${s.endAt?`<span class="timer" id="tm" aria-live="off">${fmt(s.endAt-Date.now())}</span>`:''}</div>
    <div class="progress" aria-label="ความคืบหน้า" role="progressbar" aria-valuemin="0" aria-valuemax="${s.ids.length}" aria-valuenow="${s.idx+1}"><i style="width:${(s.idx+1)/s.ids.length*100}%"></i></div>
    <div class="qhead"><span>ข้อ ${s.idx+1}/${s.ids.length}</span><span class="pill">บทที่ ${q.ch}</span><span class="pill gray">${LV[q.lv]}</span>${q.sc?'<span class="pill gray">สถานการณ์</span>':''}${q.x?'<span class="pill gray">เสริม นอกสไลด์</span>':''}${s.skip[id]&&chosen==null?'<span class="pill gray">ข้ามไว้</span>':''}</div>`;
  const choices = ord.map((oi,pos)=>{
    let cls='choice', dis=submitted?'disabled':'';
    if(submitted){ if(oi===0) cls+=' correct'; else if(oi===chosen) cls+=' wrong'; }
    return `<button class="${cls}" role="radio" aria-checked="${chosen===oi}" data-oi="${oi}" ${dis}><span class="k">${KEYS[pos]}</span><span>${esc(q.c[oi])}</span></button>`;
  }).join('');
  let fb='';
  if(submitted){ fb = feedbackHtml(q, ord, chosen); }
  $app.innerHTML = `${head}<h1 class="stem" tabindex="-1" id="stem">${esc(q.q)}</h1><div class="choices" role="radiogroup" aria-label="ตัวเลือก">${choices}</div>${fb}
   ${s.mode==='mock'?mockPalette(s):''}<p class="kbd" style="margin-top:14px">ปุ่มลัด: 1–4 เลือก · Enter ${s.feedback==='instant'?'ส่ง/ถัดไป':'ถัดไป'}</p>`;
  // nav
  const isLast = s.idx===s.ids.length-1;
  let nav='';
  if(s.feedback==='instant'){
    nav = `<button class="btn" id="prev" ${s.idx===0?'disabled':''}>ย้อนกลับ</button>`+
      (submitted? `<button class="btn primary" id="next">${isLast?'ดูผลสรุป':'ข้อถัดไป'}</button>`
       : `<button class="btn" id="skip">${isLast?'ข้าม/จบ':'ข้าม'}</button><button class="btn primary" id="sub" ${chosen==null?'disabled':''}>ส่งคำตอบ</button>`);
  } else {
    nav = `<button class="btn" id="prev" ${s.idx===0?'disabled':''}>ก่อนหน้า</button>`+
      (isLast? `<button class="btn primary" id="fin">ส่งข้อสอบ (${answered}/${s.ids.length})</button>` : `<button class="btn primary" id="next">${chosen==null?'ข้าม/ถัดไป':'ถัดไป'}</button>`);
  }
  setNav(nav + `<button class="btn ghost" id="quit" aria-label="ออกไปหน้าหลัก" style="flex:0 0 auto">⋯</button>`);
  // bind
  $app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ if(submitted) return; s.ans[id]=+b.dataset.oi; delete s.skip[id]; save(); viewQuiz(); const sb=document.getElementById('sub')||document.getElementById('next')||document.getElementById('fin'); });
  const g=x=>document.getElementById(x);
  if(g('prev')) g('prev').onclick=()=>{ s.idx=Math.max(0,s.idx-1); save(); viewQuiz(); focusStem(); };
  if(g('next')) g('next').onclick=()=>{ if(s.feedback==='end' && s.ans[id]==null) s.skip[id]=1; if(isLast){ finishSession(); } else { s.idx++; save(); viewQuiz(); focusStem(); } };
  if(g('sub')) g('sub').onclick=()=>{ if(s.ans[id]==null) return; s.sub[id]=1; record(id, s.ans[id]===0); save(); viewQuiz(); const f=document.querySelector('.fb'); if(f){ f.setAttribute('tabindex','-1'); f.focus({preventScroll:true}); f.scrollIntoView({behavior:'smooth',block:'nearest'}); } };
  if(g('skip')) g('skip').onclick=()=>{ s.skip[id]=1; if(isLast) finishSession(); else { s.idx++; save(); viewQuiz(); focusStem(); } };
  if(g('fin')) g('fin').onclick=()=>{ const un=s.ids.length-answered; confirmBox(un?`ยังไม่ได้ตอบ ${un} ข้อ ต้องการส่งเลยหรือไม่?`:'ส่งข้อสอบและดูผล?','ส่งข้อสอบ',finishSession); };
  g('quit').onclick=()=>confirmBox('ออกไปหน้าหลัก? (ความคืบหน้าชุดนี้ถูกบันทึกไว้ กลับมาทำต่อได้)','ออก',()=>{location.hash='#/';});
  $app.querySelectorAll('.palette button').forEach(b=>b.onclick=()=>{ s.idx=+b.dataset.i; save(); viewQuiz(); focusStem(); });
  // timer
  clearInterval(tick);
  if(s.endAt){ tick=setInterval(()=>{ const t=document.getElementById('tm'); const left=s.endAt-Date.now(); if(left<=0){ clearInterval(tick); finishSession(); return; } if(t){ t.textContent=fmt(left); t.classList.toggle('low', left<5*60000); } },1000); }
}
function focusStem(){ const h=document.getElementById('stem'); if(h){ h.focus({preventScroll:true}); window.scrollTo({top:0}); } }
function mockPalette(s){
  return `<details style="margin-top:16px"><summary>ภาพรวมข้อสอบ (ตอบแล้ว ${Object.keys(s.ans).filter(k=>s.ans[k]!=null).length}/${s.ids.length})</summary><div class="palette" style="margin-top:10px">${s.ids.map((id,i)=>`<button class="${s.ans[id]!=null?'done':''} ${i===s.idx?'cur':''}" data-i="${i}" aria-label="ไปข้อ ${i+1}">${i+1}</button>`).join('')}</div></details>`;
}
function feedbackHtml(q, ord, chosen){
  const ok = chosen===0;
  const posOf = oi => KEYS[ord.indexOf(oi)];
  const why = ord.map(oi=> oi===0? '' : `<li><span class="k">${posOf(oi)}</span>${esc(q.w[oi-1])}</li>`).join('');
  return `<div class="fb ${chosen==null?'':(ok?'ok':'bad')}" aria-live="polite">
    <div class="verdict">${chosen==null?'ยังไม่ได้ตอบข้อนี้':(ok?'✓ ถูกต้อง':'✗ ยังไม่ถูก')}</div>
    ${ok?'':`<p><b>คำตอบที่ถูก: ${posOf(0)}.</b> ${esc(q.c[0])}</p>`}
    <p><b>เพราะ</b> ${esc(q.ex)}</p>
    <p style="margin-top:10px"><b>ทำไมตัวเลือกอื่นผิด</b></p><ul class="why">${why}</ul>
    <div class="src">${q.x?`📘 บทที่ ${q.ch} · ${esc(q.pg)} — ${esc(q.ev)}`:`📖 บทที่ ${q.ch} ${esc(D.meta.pgLabel||'หน้า')} ${esc(q.pg)} — “${esc(q.ev)}”`}<br><span class="small">จุดประสงค์: ${esc(q.lo)}</span></div>
  </div>`;
}

function viewResults(){
  const s=S.session; if(!s){ location.hash='#/'; return; }
  clearInterval(tick);
  const rows=s.ids.map(id=>({id,q:QBY[id],a:s.ans[id]}));
  const done=rows.filter(r=>s.feedback==='end'? true : s.sub[r.id]);
  const correct=rows.filter(r=>r.a===0 && (s.feedback==='end'||s.sub[r.id])).length;
  const answered=rows.filter(r=>r.a!=null && (s.feedback==='end'||s.sub[r.id])).length;
  const skipped=s.ids.length-answered;
  const by={}; rows.forEach(r=>{ const c=r.q.ch; by[c]=by[c]||{n:0,c:0}; by[c].n++; if(r.a===0 && (s.feedback==='end'||s.sub[r.id])) by[c].c++; });
  const score = correct/s.ids.length;
  const weak = Object.keys(by).filter(c=>by[c].c/by[c].n<0.6).map(Number);
  const dur = s.finishedAt? Math.round((s.finishedAt-s.started)/60000):null;
  const wrongIds = rows.filter(r=>r.a!==0).map(r=>r.id);
  $app.innerHTML=`<h1>ผลสรุป: ${esc(s.title)}</h1>
  <div class="card"><div style="font-size:34px;font-weight:700">${correct}/${s.ids.length} <span style="font-size:20px" class="muted">(${Math.round(score*100)}%)</span></div>
  <p class="muted small">ตอบ ${answered} · ข้าม/ไม่ได้ตอบ ${skipped}${dur!=null?` · ใช้เวลา ~${dur} นาที`:''}</p>
  <p>${score>=.8?'ดีมาก! ระดับนี้อยู่ในช่วง A ตามเกณฑ์ในสไลด์ — ทบทวนข้อที่พลาดแล้วไปต่อ':score>=.6?'มาถูกทางแล้ว เก็บข้อที่พลาดอีกนิดจะขึ้นไปได้อีก':'ไม่เป็นไร ข้อที่ผิดคือแผนที่บอกว่าต้องทบทวนตรงไหน เริ่มจากบทที่อ่อนก่อน'}</p></div>
  <h2>คะแนนแยกบท</h2><div class="card"><table><tr><th>บท</th><th>ถูก</th><th style="width:35%"></th></tr>${Object.keys(by).sort((a,b)=>a-b).map(c=>{const r=by[c].c/by[c].n; return `<tr><td>บท ${c} <span class="small muted">${esc(CH.find(x=>x.ch==c).short)}</span></td><td>${by[c].c}/${by[c].n}</td><td><div class="bar"><i style="width:${r*100}%;background:${barColor(r)}"></i></div></td></tr>`;}).join('')}</table>
  ${weak.length?`<p class="small" style="margin-top:8px">ควรทบทวน: ${weak.map(c=>`<a href="#/ch/${c}">บทที่ ${c}</a>`).join(', ')}</p>`:''}</div>
  <h2>ทบทวนรายข้อ</h2>
  ${rows.map((r,i)=>{ const ok=r.a===0; const show = s.feedback==='end'||s.sub[r.id]; return `<details><summary><span class="${ok?'ok-text':'bad-text'}">${ok?'✓':(r.a==null?'–':'✗')}</span> ข้อ ${i+1} · บท ${r.q.ch} · ${esc(r.q.q.slice(0,70))}${r.q.q.length>70?'…':''}</summary>
    <p style="font-weight:600">${esc(r.q.q)}</p>${r.a!=null&&!ok&&show?`<p class="bad-text small">คุณตอบ: ${esc(r.q.c[r.a])}</p>`:''}${feedbackHtml(r.q, s.order[r.id], show?r.a:null)}</details>`; }).join('')}`;
  const back = s.back||'#/';
  setNav(`<a class="btn" href="#/">หน้าหลัก</a>${wrongIds.length?`<button class="btn primary" id="rw">ฝึกข้อที่ผิด/ข้าม (${wrongIds.length})</button>`:`<a class="btn primary" href="${back}">ทำชุดใหม่</a>`}`);
  const rw=document.getElementById('rw'); if(rw) rw.onclick=()=>startSession({mode:'review',title:'ฝึกข้อที่ผิด/ข้ามจากชุดที่แล้ว',ids:shuffle(wrongIds),feedback:'instant'});
}

// ---------- router ----------
function render(){
  clearInterval(tick);
  const h=location.hash||'#/';
  const m=h.match(/^#\/ch\/(\d+)/);
  window.scrollTo({top:0});
  if(h==='#/'||h==='#'||h==='') viewHome();
  else if(h==='#/learn') viewLearn();
  else if(m) viewChapter(+m[1]);
  else if(h==='#/practice') viewPractice();
  else if(h==='#/mock') viewMock();
  else if(h==='#/mistakes') viewMistakes();
  else if(h==='#/last') viewLast();
  else if(h==='#/stats') viewStats();
  else if(h==='#/about') viewAbout();
  else if(h==='#/quiz') viewQuiz();
  else if(h==='#/results') viewResults();
  else viewHome();
}
window.addEventListener('hashchange', render);
document.addEventListener('keydown', e=>{
  if(location.hash!=='#/quiz' || document.querySelector('.modal-bg')) return;
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  const n = {'1':0,'2':1,'3':2,'4':3}[e.key];
  if(n!=null){ const b=document.querySelectorAll('.choice')[n]; if(b && !b.disabled){ b.click(); } return; }
  if(e.key==='Enter' && !(e.target && e.target.classList && (e.target.classList.contains('choice')||e.target.tagName==='BUTTON'||e.target.tagName==='A'||e.target.tagName==='SUMMARY'))){
    const b=document.getElementById('sub')||document.getElementById('next')||document.getElementById('fin'); if(b && !b.disabled){ e.preventDefault(); b.click(); }
  }
});
render();
})();
</script>
</body>
</html>
